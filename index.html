<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Quiztagram</title>
  </head>
  <body>
    <div id="root">
      <div id="app-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1628;color:#fff;font-family:sans-serif;flex-direction:column;gap:12px;">
        <div style="font-size:2.5rem">🩺</div>
        <p style="margin:0;font-size:1rem;opacity:0.7">Loading Quiztagram…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-loader')
        if (el) el.innerHTML = '<div style="text-align:center;padding:24px"><div style="font-size:2rem">🩺</div><p style="color:#f87171;margin:8px 0">Failed to load app</p><p style="opacity:0.6;font-size:0.8rem">' + (e.message || 'Unknown error') + '</p></div>'
      })
    </script>
  </body>
</html>
